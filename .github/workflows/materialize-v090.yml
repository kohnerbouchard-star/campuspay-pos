name: Materialize CampusPay v0.9 online store
on:
  push:
    branches: [feat/online-store-v090-final]
    paths: ['.bootstrap/V090_READY']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campuspay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:ci-test-only@localhost:5432/campuspay
      NEXT_TELEMETRY_DISABLED: '1'
      CI_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and extract exact v0.9 source
        run: |
          cat .bootstrap/store-v090.small* > /tmp/store-v090.b64
          base64 -d /tmp/store-v090.b64 > /tmp/store-v090.tar.xz
          echo 'bbec749999faf42de94a9f14c4e951484a0cb3e6d6afd3d507a993f85fa028be  /tmp/store-v090.tar.xz' | sha256sum -c -
          tar -xJf /tmp/store-v090.tar.xz -C .
          python3 - <<'PY'
          from pathlib import Path

          component = Path('src/features/store/ui/OrderFulfillmentScreen.tsx')
          text = component.read_text()
          old = "  useEffect(() => { void load() }, [])"
          new = """  useEffect(() => {
            let active = true
            void fetchStaffOnlineOrders()
              .then((data) => {
                if (!active) return
                setOrders(data)
                setError(null)
              })
              .catch((caught) => {
                if (!active) return
                setError(caught instanceof Error ? caught.message : 'Orders could not be loaded')
              })
            return () => { active = false }
          }, [])"""
          assert old in text, 'Order fulfillment lint patch target changed'
          component.write_text(text.replace(old, new, 1))

          integration = Path('scripts/integration-test.mjs')
          text = integration.read_text()
          old = " const onlineCoupon=await request(inventory,'/api/coupons'"
          new = " await request(inventory,'/api/coupons'"
          assert old in text, 'Integration lint patch target changed'
          integration.write_text(text.replace(old, new, 1))

          sql_replacements = [
            ("  from private.student_credentials\n  where student_id = v_student.id\n  for update;",
             "  from private.student_credentials sc\n  where sc.student_id = v_student.id\n  for update;"),
            ("    update private.student_credentials\n    set failed_attempts = failed_attempts + 1,\n        locked_until = case when failed_attempts + 1 >= 3 then v_now + interval '5 minutes' else null end\n    where student_id = v_student.id;",
             "    update private.student_credentials sc\n    set failed_attempts = sc.failed_attempts + 1,\n        locked_until = case when sc.failed_attempts + 1 >= 3 then v_now + interval '5 minutes' else null end\n    where sc.student_id = v_student.id;"),
            ("  update private.student_credentials\n  set failed_attempts = 0, locked_until = null\n  where student_id = v_student.id;",
             "  update private.student_credentials sc\n  set failed_attempts = 0, locked_until = null\n  where sc.student_id = v_student.id;"),
            ("  update private.customer_sessions set revoked_at = v_now\n  where student_id = v_student.id and revoked_at is null;",
             "  update private.customer_sessions cs set revoked_at = v_now\n  where cs.student_id = v_student.id and cs.revoked_at is null;"),
            ("  v_order_item_id uuid;\n", ""),
            ("    insert into private.online_order_items(\n      order_id, product_id, product_name_snapshot, quantity, unit_price_won, line_total_won\n    ) values (\n      v_order.id, v_priced.product_id, v_priced.product_name, v_priced.quantity,\n      v_priced.unit_price_won, v_priced.line_total_won\n    ) returning id into v_order_item_id;\n\n", ""),
            ("    update private.sale_items set cogs_won = v_line_cogs where id = v_sale_item_id;\n    update private.online_order_items set cogs_won = v_line_cogs where id = v_order_item_id;\n    v_all_cogs := v_all_cogs + v_line_cogs;",
             "    update private.sale_items set cogs_won = v_line_cogs where id = v_sale_item_id;\n    insert into private.online_order_items(\n      order_id, product_id, product_name_snapshot, quantity, unit_price_won, line_total_won, cogs_won\n    ) values (\n      v_order.id, v_priced.product_id, v_priced.product_name, v_priced.quantity,\n      v_priced.unit_price_won, v_priced.line_total_won, v_line_cogs\n    );\n    v_all_cogs := v_all_cogs + v_line_cogs;"),
          ]
          for path in [Path('database/schema/012_online_store.sql'), Path('database/migrations/20260906160000_online_store.sql')]:
            text = path.read_text()
            for old, new in sql_replacements:
              assert old in text, f'Online-store SQL patch target changed in {path}: {old[:70]}'
              text = text.replace(old, new, 1)
            old_trigger = "where student_id = coalesce(new.student_id, old.student_id) and revoked_at is null;"
            if old_trigger in text:
              text = text.replace(old_trigger, "where student_id = new.student_id and revoked_at is null;", 1)
            path.write_text(text)
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-v090.yml
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:static
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - name: Commit verified source to feature branch
        run: |
          rm -rf .validation
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add customer online store and room delivery fulfillment'
          git push origin HEAD:feat/online-store-v090-final
