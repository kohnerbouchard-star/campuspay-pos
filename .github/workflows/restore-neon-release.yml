name: Install CampusPay Neon release

on:
  push:
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore validated release
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          cat .bootstrap/neon-release.part* | base64 --decode > /tmp/campuspay-neon-release.tar.xz
          echo 'cda7be12b5d5ac0840885df811bbae459fb33808a2ba2a6d0c657b063079a9a7  /tmp/campuspay-neon-release.tar.xz' | sha256sum --check
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xJf /tmp/campuspay-neon-release.tar.xz -C .
          rm -rf .bootstrap
          test -f src/app/page.tsx
          test -f src/lib/db/rpc.ts
          test -f database/migrations/20260904190000_initial_campuspay_neon.sql
          test -f database/migrations/20260905033000_demo_bootstrap.sql
          test -f .github/workflows/validate.yml

      - name: Commit Neon conversion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate CampusPay backend from Supabase to Neon'
          git push origin HEAD:main
