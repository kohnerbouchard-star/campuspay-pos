name: Restore CampusPay source tree

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'
      - '.bootstrap/src.tar.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore src tree
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/src.tar.gz.b64
          base64 --decode .bootstrap/src.tar.gz.b64 > /tmp/campuspay-src.tar.gz
          tar -xzf /tmp/campuspay-src.tar.gz
          test -f src/app/page.tsx
          test -f src/features/pos/ui/POSScreen.tsx
          test -f src/lib/supabase/server.ts
          rm -rf .bootstrap

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore CampusPay application source tree'
          git push origin HEAD:main
