# Temporary, branch-scoped manifest preparation. Final qualification restores read-only jobs.
name: CampusPay product photo qualification
on:
  push:
    branches: [feat/product-photos-20261008]
permissions:
  contents: read
jobs:
  dependency-preparation:
    if: github.repository == 'kohnerbouchard-star/campuspay-pos' && github.ref == 'refs/heads/feat/product-photos-20261008'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify held source and prepare only the two approved dependencies
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test ! -e .env.local
          node --input-type=module -e 'import fs from "node:fs";import assert from "node:assert/strict";const c=JSON.parse(fs.readFileSync("vercel.json","utf8"));assert.equal(c.git.deploymentEnabled["feat/product-photos-20261008"],false);assert.equal(c.git.deploymentEnabled["feat/effective-access-workspaces-20261005"],false);assert.ok(Object.values(c.git.deploymentEnabled).every(v=>v===false));'
          cp package.json /tmp/photo-package-before.json
          cp package-lock.json /tmp/photo-lock-before.json
          npm install --package-lock-only --ignore-scripts --save-exact @vercel/blob@2.6.1 sharp@0.35.5
      - name: Commit manifest bytes only with a non-fast-forward guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import assert from 'node:assert/strict';
          const repository='kohnerbouchard-star/campuspay-pos',branch='feat/product-photos-20261008';
          assert.equal(process.env.GITHUB_REPOSITORY,repository);assert.equal(process.env.GITHUB_REF,`refs/heads/${branch}`);
          const before=JSON.parse(fs.readFileSync('/tmp/photo-package-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('package.json','utf8'));
          before.dependencies['@vercel/blob']='2.6.1';before.dependencies.sharp='0.35.5';assert.deepEqual(after,before);
          const oldLock=JSON.parse(fs.readFileSync('/tmp/photo-lock-before.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const [name,pkg] of Object.entries(oldLock.packages)){if(name)assert.equal(lock.packages[name]?.version,pkg.version,`Unexpected dependency version change: ${name}`)}
          assert.equal(lock.packages['node_modules/@vercel/blob'].version,'2.6.1');assert.equal(lock.packages['node_modules/sharp'].version,'0.35.5');
          const api=async(path,method='GET',body)=>{const response=await fetch(`https://api.github.com/repos/${repository}/${path}`,{method,headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(20000)});if(!response.ok)throw new Error(`Manifest publication ${method} failed: HTTP ${response.status}`);return response.json()};
          const ref=await api(`git/ref/heads/${branch}`);assert.equal(ref.object.sha,process.env.EXPECTED_HEAD,'Branch changed; stop without overwrite');
          const parent=await api(`git/commits/${ref.object.sha}`);
          const entries=[];for(const path of ['package.json','package-lock.json']){const blob=await api('git/blobs','POST',{content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});entries.push({path,mode:'100644',type:'blob',sha:blob.sha})}
          const tree=await api('git/trees','POST',{base_tree:parent.tree.sha,tree:entries});
          const commit=await api('git/commits','POST',{message:'Pin Vercel Blob and direct Sharp dependencies for product photos',tree:tree.sha,parents:[ref.object.sha]});
          // A concurrent branch advance makes this update non-fast-forward and fails closed.
          await api(`git/refs/heads/${branch}`,'PATCH',{sha:commit.sha,force:false});
          fs.mkdirSync('.validation/product-photo-dependencies',{recursive:true});
          for(const path of ['package.json','package-lock.json'])fs.copyFileSync(path,`.validation/product-photo-dependencies/${path}`);
          fs.writeFileSync('.validation/product-photo-dependencies/manifest-commit.txt',commit.sha+'\n');
          console.log(`Manifest commit: ${commit.sha}; tree: ${tree.sha}`);
          NODE
      - name: Retain isolated locked dependencies for local qualification
        run: |
          npm ci --ignore-scripts
          tar -czf .validation/product-photo-dependencies/node-modules.tar.gz node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: product-photo-dependency-candidate
          path: .validation/product-photo-dependencies/
          include-hidden-files: true
          if-no-files-found: error
