name: Export current CampusPay source
on:
  push:
    paths: ['.bootstrap/EXPORT_SOURCE']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf .git .bootstrap
          tar -czf /tmp/campuspay-current-main.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: campuspay-current-main
          path: /tmp/campuspay-current-main.tar.gz
          retention-days: 1
