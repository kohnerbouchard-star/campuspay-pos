name: CampusPay validation
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: campuspay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_UNPOOLED: postgresql://postgres:ci-test-only@localhost:5432/campuspay
      NEXT_TELEMETRY_DISABLED: '1'
      CI_BROWSER: '1'
      CAMPUSPAY_LOCAL_HTTP: 'true'
      APP_ORIGIN: 'http://localhost:3000'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Record exact candidate source for reproducible validation
        run: |
          mkdir -p .validation
          git rev-parse HEAD > .validation/tested-commit.txt
          git rev-parse 'HEAD^{tree}' > .validation/tested-tree.txt
          git archive --format=tar.gz --output=.validation/tested-source.tar.gz HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/verify-local-repair.mjs
      - run: node scripts/verify-workflow-pins.mjs
      - run: node --experimental-strip-types --test --experimental-test-coverage --test-coverage-include='src/lib/http/deployment-policy.ts' --test-coverage-lines=95 --test-coverage-functions=100 --test-coverage-branches=85 scripts/production-boundaries.test.mjs
      - run: node --test scripts/backup-envelope.test.mjs
      - run: npm ci
      - name: Record complete dependency audit including development tools
        run: npm audit --json > .validation/dependency-audit.json || true
      - run: npm run security:dependencies
      - run: npm run validate:static
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run db:migrate
      - run: node scripts/verify-runtime-readiness.mjs
      - run: node scripts/verify-student-roster.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-complete-enrollment.mjs
      - run: node scripts/verify-sale-refunds.mjs
      - run: node scripts/verify-operations.mjs
      - run: node scripts/verify-administration.mjs
      - run: node scripts/verify-administration-hardening.mjs
      - run: node scripts/verify-refund-preview.mjs
      - run: node scripts/verify-partial-refunds.mjs
      - run: node scripts/verify-funding.mjs
      - run: node scripts/verify-history.mjs
      - run: node scripts/verify-reconciliation.mjs
      - run: npm run test:integration
      - name: Verify encrypted PostgreSQL backup and isolated restore
        env:
          PG_TOOL_CONTAINER: ${{ job.services.postgres.id }}
          PG_DUMP_BIN: ./scripts/ci/pg-dump
          PG_RESTORE_BIN: ./scripts/ci/pg-restore
        run: node scripts/verify-backup-restore.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-results
          path: .validation/
          include-hidden-files: true

  propose_dependency_lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/production-boundaries-recovery-20261001'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate narrowly scoped lockfile proposal without executing package scripts
        run: |
          mkdir -p .lock-proposal
          git rev-parse HEAD > .lock-proposal/source-commit.txt
          npm update brace-expansion --package-lock-only --ignore-scripts --no-audit
          node scripts/prepare-lock-proposal.mjs
          cp package-lock.json .lock-proposal/package-lock.json
          npm audit --json > .lock-proposal/audit.json
          git diff -- package-lock.json > .lock-proposal/lock.diff
      - name: Store verified proposal blob without modifying a branch
        env:
          PROPOSAL_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-lock-proposal.mjs publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-lock-proposal
          path: .lock-proposal/
          include-hidden-files: true
